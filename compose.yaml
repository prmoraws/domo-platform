name: ${COMPOSE_PROJECT_NAME:-domo-platform}

services:
  postgres:
    image: postgres:17-alpine
    container_name: domo-postgres
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

  evolution-postgres:
    image: postgres:17-alpine
    container_name: domo-evolution-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB}
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  evolution-redis:
    image: redis:7.4-alpine
    container_name: domo-evolution-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: domo-evolution
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      LANGUAGE: pt-BR
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: domo_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: domo_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - backend
      - edge

  mariadb:
    image: mariadb:10.11.18
    container_name: domo-mariadb-replica
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REPLICA_BLUE_DATABASE: ${REPLICA_BLUE_DATABASE}
      REPLICA_GREEN_DATABASE: ${REPLICA_GREEN_DATABASE}
      MYSQL_READONLY_USER: ${MYSQL_READONLY_USER}
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./infrastructure/mariadb/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - healthcheck.sh --connect --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - backend
      - edge

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.4
    container_name: domo-n8n
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      DOMO_WHATSAPP_ALLOWED_JID: ${DOMO_WHATSAPP_ALLOWED_JID}
      DOMO_WHATSAPP_COMMAND_PREFIX: ${DOMO_WHATSAPP_COMMAND_PREFIX}
      DOMO_WHATSAPP_INSTANCE_NAME: ${DOMO_WHATSAPP_INSTANCE_NAME}

      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}

      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"

    ports:
      - "127.0.0.1:5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend
      - edge

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    image: domo-api:0.1.0
    container_name: domo-api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      TZ: ${TZ}
      API_PORT: 3001
      API_HOST: 0.0.0.0
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN}
      LOG_LEVEL: info
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:4b
      MYSQL_HOST: mariadb
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_READONLY_USER}
      MYSQL_PASSWORD: ${MYSQL_READONLY_PASSWORD}

    ports:
      - "127.0.0.1:${API_PORT}:3001"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend
      - edge

  ollama:
    image: ollama/ollama:0.32.6
    container_name: domo-ollama
    restart: unless-stopped

    gpus: all

    environment:
      TZ: ${TZ}
      OLLAMA_KEEP_ALIVE: 5m

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - backend
      - edge

volumes:
  evolution_postgres_data:
    name: domo-evolution-postgres-data

  evolution_redis_data:
    name: domo-evolution-redis-data

  evolution_instances:
    name: domo-evolution-instances

  postgres_data:
    name: domo-postgres-data

  n8n_data:
    name: domo-n8n-data

  mariadb_data:
    name: domo-mariadb-data

  ollama_data:
    name: domo-ollama-data

networks:
  backend:
    name: domo-backend
    internal: true

  edge:
    name: domo-edge
